name: ajish_portfolio
description: Ajish Kumar K - Flutter Developer Portfolio
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  animated_text_kit: ^4.2.2
  url_launcher: ^6.2.3
  font_awesome_flutter: ^10.7.0
  visibility_detector: ^0.4.0+2
  smooth_page_indicator: ^1.1.0
  open_file: ^3.3.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ajish.jpg
    - assets/resume/AjishKumar_resume.pdf
